version: "3.4"

# Standalone Docker Compose is kept only as a configuration example.
# goburn requires Kubernetes in-cluster credentials and metrics-server to run.

services:
  goburn:
    container_name: goburn
    image: pedromol/goburn:latest
    environment:
      - TARGET_CPU_UTILIZATION=80
      - TARGET_MEMORY_UTILIZATION=80
      - MIN_CPU_UTILIZATION=20
      - MIN_MEMORY_UTILIZATION=20
      - MIN_NETWORK_UTILIZATION_MBPS=20
      - MONITOR_INTERVAL_SECONDS=30
      - SCALE_UP_DELAY_SECONDS=60
      - SCALE_DOWN_DELAY_SECONDS=120
      - MAX_MEMORY_MB=1024
      - NODE_NAME=docker-host
      - ENABLE_MEMORY_UTILIZATION=true
      - NETWORK_INTERFACE=eth0
    restart: "no"
    # Note: For runtime validation, deploy with k8s-manifests.yaml instead.
